server:
  port: 8084

spring:
  application:
    name: seats-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5436/seats_db
    username: mts_user
    password: mts_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

seats:
  lock:
    ttl-seconds: 300  # 5 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: seats-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        seat.lock.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        seat.lock.duration: 0.5, 0.95, 0.99

logging:
  level:
    com.shubh.movietickets: DEBUG
