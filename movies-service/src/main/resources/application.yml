server:
  port: 8083

spring:
  application:
    name: movies-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5435/movies_db
    username: mts_user
    password: mts_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092

# Feign - direct URL for now, Eureka will override in Phase 7
feign:
  theaters-service:
    url: http://localhost:8082

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      theaters-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: movies-service

logging:
  level:
    com.shubh.movietickets: DEBUG
