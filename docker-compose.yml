# ============================================================
# Movie Ticketing System — Docker Compose (Infrastructure)
# ============================================================
# Spins up all backing services needed for local development.
# Services themselves are run via IDE or Gradle bootRun.
# ============================================================

services:

  # ── PostgreSQL Databases (one per service) ──────────────────

  users-db:
    image: postgres:16-alpine
    container_name: mts-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_pass
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts_user -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  theaters-db:
    image: postgres:16-alpine
    container_name: mts-theaters-db
    environment:
      POSTGRES_DB: theaters_db
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_pass
    ports:
      - "5434:5432"
    volumes:
      - theaters-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts_user -d theaters_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  movies-db:
    image: postgres:16-alpine
    container_name: mts-movies-db
    environment:
      POSTGRES_DB: movies_db
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_pass
    ports:
      - "5435:5432"
    volumes:
      - movies-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts_user -d movies_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  seats-db:
    image: postgres:16-alpine
    container_name: mts-seats-db
    environment:
      POSTGRES_DB: seats_db
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_pass
    ports:
      - "5436:5432"
    volumes:
      - seats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts_user -d seats_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  tickets-db:
    image: postgres:16-alpine
    container_name: mts-tickets-db
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_pass
    ports:
      - "5437:5432"
    volumes:
      - tickets-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts_user -d tickets_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: mts-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Kafka (KRaft mode — no Zookeeper) ──────────────────────

  kafka:
    image: apache/kafka:3.8.0
    container_name: mts-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Observability Stack ─────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mts-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mts-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: mts-zipkin
    ports:
      - "9411:9411"

volumes:
  users-db-data:
  theaters-db-data:
  movies-db-data:
  seats-db-data:
  tickets-db-data:
  grafana-data:
